[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-radiation"
version = "0.1.0"
description = "RADAR — Radiation Analysis and Design Assessment Resource"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RADAR developers" }
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

ui = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"radar.data.normative" = ["*.json", "*/*.json", "*/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"